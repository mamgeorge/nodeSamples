<html lang="en" data-bs-theme="dark"><head>
<meta charset="utf-8"><title>BPOD Updates!</title>
<meta http-equiv = "keywords" content = "MLG Martin George mamgeorge alterVista" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>document.writeln("<script type='text/javascript' src='bpod_img.js?v = " + Date.now() + "'><\/script>");</script>
<script>document.writeln("<script type='text/javascript' src='bpod_txt.js?v = " + Date.now() + "'><\/script>");</script>
<script>document.writeln("<script type='text/javascript' src='bpod_ctrl.js?v = " + Date.now() + "'><\/script>");</script>

<script>
function startup() {

	imgLen = pictures.length;
	btnAdvance = Math.floor( imgLen / 10 );
	dayInYear = getUtilDayInYear( new Date() );
	bpod = Math.floor( ( dayInYear/365 ) * imgLen ) - 1;

	document.getElementById( 'timed' ).innerHTML = new Date().toISOString() + ' | ' + bpod
	showEntry( bpod );
}	

function showEntry(item) {

		 if ( item == 'b' ) { imgCtr = 0; }
	else if ( item == 'v' ) { imgCtr = imgCtr - btnAdvance; if ( imgCtr < 0 ) { imgCtr = 0; } }
	else if ( item == '-' ) { if ( imgCtr > 0 ) { imgCtr--; } }
	else if ( item == '+' ) { if ( imgCtr < imgLen ) { imgCtr++; } }
	else if ( item == '^' ) { imgCtr = imgCtr + btnAdvance; if ( imgCtr > imgLen) { imgCtr = imgLen-1; } }
	else if ( item == 'f' ) { imgCtr = imgLen-1; }
	else { if ( item > imgLen ) { item = imgLen - 1; }; imgCtr = Number( item ) ; }

	// adjust txtItem for pictures duplicates
	let picCode = pictures[imgCtr][0]
	let tctr = txtItem.findIndex(cod => cod[0] === picCode )
	
	// simplify description by removing extra spaces
	let desc = txtItem[tctr][4].replace( /\s+/g, ' ' )
	
	document.getElementById( 'image' ).src = folder + pictures[imgCtr][1] + ext
	//
	document.getElementById( 'item' ).value = (imgCtr) + ' | ' + txtItem[tctr][0] + ' | ' + pictures[imgCtr][1]
	document.getElementById( 'refs' ).value = txtItem[tctr][1] 
	document.getElementById( 'vers' ).value = txtItem[tctr][2] 
	document.getElementById( 'labl' ).value = txtItem[tctr][3] 
	document.getElementById( 'desc' ).value = desc
	document.getElementById( 'sign' ).value = txtItem[tctr][5] 
	//
	document.getElementById( 'copyright' ).innerHTML = txtCopyright 
}

window.onload = function() { startup() }
</script>

<style>
body { font-family: verdana; line-height: 1; }
.imgv { width: 400px; height: 400px; }
.btni { height: 95px; }

.lbls { background-color: #608060; width: 1%; text-transform: uppercase;}
.line { height: 40px; }
.desc { height: 260px; white-space: normal !important; }
</style>
</head>

<body>
<!--div w3-include-html = "bpod_head.html"></div-->
<div class="container-fluid px-20 bg-dark text-white text-center">

<div class="container-fluid p-2 px-20 bg-primary text-white text-center">
<h3 onclick = "location.href = 'bpod.html'" >BPOD Updates!</h3>
<span id="timed" class = "smallink" >*</span></div>

<div class="d-flex justify-content-center">
<table class="table">
<tr>
<td class = "imgv">
	<img id = "image" class="img-fluid justify-content-center" src="images/history.png" alt="image" >
	</td>
<td>
	<table class="w-100">
	<tr><th class = "lbls">item</th><td><textarea id = "item" class="form-control line" placeholder="item"	></textarea></td></tr>
	<tr><th class = "lbls">refs</th><td><textarea id = "refs" class="form-control line" placeholder="refs"	></textarea></td></tr>
	<tr><th class = "lbls">vers</th><td><textarea id = "vers" class="form-control line" placeholder="verse"></textarea></td></tr>
	<tr><th class = "lbls">labl</th><td><textarea id = "labl" class="form-control line" placeholder="label"></textarea></td></tr>
	<tr><th class = "lbls">desc</th><td><textarea id = "desc" class="form-control desc" placeholder="desc"	></textarea></td></tr>
	<tr><th class = "lbls">sign</th><td><textarea id = "sign" class="form-control line" placeholder="sign"	></textarea></td></tr>
	</table>
</td>
<tr>
	<td rowspan = "2">
		<div class="d-grid gap-2" >
		<button type="button" class="btn btn-secondary btni" >Select Image</button>
		</div>
	</td>
	<td><div class = "row row-cols-6 pe-3">
		<button type="button" onclick="showEntry('b')" class="btn btn-primary col">BEG</button>
		<button type="button" onclick="showEntry('v')" class="btn btn-primary col"><< </button>
		<button type="button" onclick="showEntry('-')" class="btn btn-info col"	  > < </button>
		<button type="button" onclick="showEntry('+')" class="btn btn-info col"	  > > </button>
		<button type="button" onclick="showEntry('^')" class="btn btn-primary col"> >></button>
		<button type="button" onclick="showEntry('f')" class="btn btn-primary col">END</button>		
	</div></td>
</tr>
<tr>
	<td><div class = "row row-cols-3 pe-3">
		<button type="button" onclick="entryAdd()" class="btn btn-success col" >CREATE</button>
		<button type="button" onclick="entryMod()" class="btn btn-warning col" >UPDATE</button>
		<button type="button" onclick="entryDel()" class="btn btn-danger  col" >DELETE</button>
		</div>
	</td>
</tr>
</table>
</div>

<span id = "copyright" ></span>
</div>
